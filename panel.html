<!doctype html>

<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ASSASSING INYECTOR ⛷️</title>
  <style>
    :root{
      --bg:#020205;
      --panel-bg: rgba(0,0,0,0.55);
      --accent: #00ff5c;
      --accent-2: #00d6ff;
      --danger: #ff2e2e;
      --card-radius: 14px;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;font-family:Inter, system-ui, Arial, sans-serif}
    html,body{height:100%;margin:0;background:var(--bg);color:#e9eef6}
    /* full-screen container for three.js */
    #threeContainer{position:fixed;inset:0;z-index:0;pointer-events:none}.app{position:relative;min-height:100vh;z-index:2;display:flex;flex-direction:column;align-items:center;padding:24px}

.header{display:flex;align-items:center;gap:12px;margin-top:6px}
.logo{font-weight:900;font-size:28px;letter-spacing:1px;color:var(--accent);text-shadow:0 0 18px rgba(0,255,120,0.12), 0 0 6px rgba(0,255,120,0.06)}
.subtitle{color:var(--accent-2);font-size:12px;padding:6px 10px;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));}

.card{width:100%;max-width:980px;margin-top:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:var(--card-radius);padding:18px;backdrop-filter: blur(6px);box-shadow:0 8px 30px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.03)}

.top-row{display:flex;align-items:center;gap:12px}
.file-picker{flex:1;display:flex;align-items:center;gap:12px}
.file-btn{background:linear-gradient(90deg,var(--accent),var(--accent-2));padding:10px 14px;border-radius:10px;color:#001;border:none;font-weight:700;cursor:pointer}
input[type=file]{display:none}

.file-name{flex:1;padding:10px 12px;border-radius:10px;background:var(--panel-bg);color:#fff;font-weight:600}

.inject-btn{background:linear-gradient(90deg,var(--danger),#ff7b7b);padding:10px 14px;border-radius:10px;color:#fff;border:none;font-weight:800;cursor:pointer}

.gear{margin-left:8px;background:transparent;border:2px solid rgba(255,255,255,0.06);width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}

.info-area{margin-top:14px;display:grid;grid-template-columns:1fr 360px;gap:14px}
.file-preview{background:var(--glass);padding:12px;border-radius:12px;min-height:220px;overflow:auto;border:1px solid rgba(255,255,255,0.02)}

.file-meta{background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.02)}

.meta-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,0.02)}

.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.color-swatch{width:36px;height:36px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.5);cursor:pointer;border:2px solid rgba(255,255,255,0.04)}

.controls{display:flex;flex-direction:column;gap:8px}
label{font-size:13px;color:#cfe9ff}
.switch{display:flex;gap:8px;align-items:center}

footer{margin-top:22px;color:rgba(255,255,255,0.45);font-size:13px}

/* small helper styles for color inputs */
.picker-row{display:flex;gap:8px;align-items:center;margin-top:8px}
input[type=color]{width:46px;height:36px;border-radius:6px;border:none;cursor:pointer}

@media (max-width:820px){
  .info-area{grid-template-columns:1fr}
  .header{flex-direction:column;align-items:flex-start}
  .logo{font-size:22px}
}

  </style>
</head>
<body>
  <div id="threeContainer"></div>
  <div class="app">
    <div class="header">
      <div class="logo">ASSASSING INYECTOR ⛷️</div>
    </div><div class="card">
  <div class="top-row">
    <div class="file-picker">
      <label class="file-btn" for="fileInput">SELECCIONAR ARCHIVOS</label>
      <input id="fileInput" type="file" accept="*/*" />
      <div id="fileName" class="file-name">Ningún archivo seleccionado</div>
    </div>
    <button id="injectBtn" class="inject-btn">INYECTAR</button>
  </div>

  <div class="info-area">
    <div class="file-preview" id="filePreview"><em>Contenido del archivo seleccionado aparecerá aquí (texto, JSON, etc.)</em></div>

    <div class="file-meta">
      <div class="controls">
        <div class="meta-row"><strong>Nombre</strong><span id="metaName">-</span></div>
        <div class="meta-row"><strong>Tamaño</strong><span id="metaSize">-</span></div>
        <div class="meta-row"><strong>Tipo</strong><span id="metaType">-</span></div>
        <div class="meta-row"><strong>Últ. mod.</strong><span id="metaDate">-</span></div>

        <div style="margin-top:8px"><label>Colores rápidos (pulsa para aplicar)</label>
          <div class="colors" id="colorPalette"></div>
        </div>

        <div style="margin-top:8px"><label>Pickers (elige cualquier color)</label>
          <div class="picker-row">
            <div style="display:flex;flex-direction:column"><small>Primario</small><input id="primaryPicker" type="color" value="#00ff5c"></div>
            <div style="display:flex;flex-direction:column"><small>Secundario</small><input id="secondaryPicker" type="color" value="#00d6ff"></div>
            <div style="display:flex;flex-direction:column"><small>Rayas</small><input id="stripePicker" type="color" value="#ffffff"></div>
          </div>
        </div>

        <div style="margin-top:10px" id="extraControls"></div>
      </div>
    </div>
  </div>

  <footer>Al tocar <strong>INYECTAR</strong> se abrirá Free Fire si está instalado en tu dispositivo.</footer>
</div>

  </div>  <!-- three.js from CDN -->  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>  <script>
    // ---------- File handling (igual que antes) ----------
    const fileInput = document.getElementById('fileInput');
    const fileNameEl = document.getElementById('fileName');
    const filePreview = document.getElementById('filePreview');
    const metaName = document.getElementById('metaName');
    const metaSize = document.getElementById('metaSize');
    const metaType = document.getElementById('metaType');
    const metaDate = document.getElementById('metaDate');

    fileInput.addEventListener('change', async (e)=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return resetFile();
      fileNameEl.textContent = f.name;
      metaName.textContent = f.name;
      metaSize.textContent = formatBytes(f.size);
      metaType.textContent = f.type || 'Desconocido';
      metaDate.textContent = f.lastModified ? new Date(f.lastModified).toLocaleString() : '-';

      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result;
        if(text && text.length > 200000){
          filePreview.innerHTML = '<strong>Archivo muy grande — vista previa truncada</strong><pre style="white-space:pre-wrap;margin-top:8px;max-height:420px;overflow:auto;font-family:monospace">'+escapeHtml(text.slice(0,200000))+'</pre>';} else if(text !== undefined){
      filePreview.innerHTML = '<pre style="white-space:pre-wrap;margin-top:8px;font-family:monospace">'+escapeHtml(text)+'</pre>';
    } else {
      filePreview.innerHTML = '<em>No se pudo mostrar el contenido como texto.</em>';
    }
  };
  reader.onerror = () => { filePreview.innerHTML = '<em>Error leyendo el archivo.</em>'; };
  if(f.type.startsWith('image/')){
    const url = URL.createObjectURL(f);
    filePreview.innerHTML = '<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><img src="'+url+'" style="max-width:100%;border-radius:8px" /><small>Imagen vista previa</small></div>';
  } else if(f.type.startsWith('audio/') || f.type.startsWith('video/')){
    const url = URL.createObjectURL(f);
    filePreview.innerHTML = '<div style="display:flex;flex-direction:column;gap:8px;align-items:center"><'+(f.type.startsWith('audio/')? 'audio':'video')+' controls src="'+url+'" style="max-width:100%"></'+(f.type.startsWith('audio/')? 'audio':'video')+'> <small>Previsualización</small></div>';
  } else { reader.readAsText(f, 'UTF-8'); }
});
function resetFile(){ fileNameEl.textContent = 'Ningún archivo seleccionado'; metaName.textContent = '-';metaSize.textContent='-';metaType.textContent='-';metaDate.textContent='-'; filePreview.innerHTML = '<em>Contenido del archivo seleccionado aparecerá aquí (texto, JSON, etc.)</em>'; }
function formatBytes(bytes){ if(bytes===0) return '0 B'; const k = 1024; const sizes = ['B','KB','MB','GB','TB']; const i = Math.floor(Math.log(bytes)/Math.log(k)); return parseFloat((bytes/Math.pow(k,i)).toFixed(2)) +' '+ sizes[i]; }
function escapeHtml(text){ return text.replace(/[&<>"']/g, s=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[s]); }

// ---------- INJECT button ----------
const injectBtn = document.getElementById('injectBtn');
injectBtn.addEventListener('click', ()=>{ const freeFireUri = 'freefireth://'; window.location.href = freeFireUri; });

// ---------- Color quick swatches and pickers ----------
const colorPalette = document.getElementById('colorPalette');
const quickColors = [
  '#ff0000','#ff7b00','#ffd100','#fff100','#b8ff00','#00ff5c','#00ffd5','#00d6ff','#4d6bff','#9b59ff','#ff4dd2','#ff88c2','#555555','#ffffff','#000000'
];
quickColors.forEach(c=>{ const sw = document.createElement('div'); sw.className='color-swatch'; sw.style.background = c; sw.addEventListener('click', ()=> applyPalette(c,c)); colorPalette.appendChild(sw); });

const primaryPicker = document.getElementById('primaryPicker');
const secondaryPicker = document.getElementById('secondaryPicker');
const stripePicker = document.getElementById('stripePicker');

function applyPalette(a,b){ document.documentElement.style.setProperty('--accent', a); document.documentElement.style.setProperty('--accent-2', b); if(window.updateThreeColors) window.updateThreeColors(a,b,stripePicker.value); }
primaryPicker.addEventListener('input', ()=>{ applyPalette(primaryPicker.value, secondaryPicker.value); });
secondaryPicker.addEventListener('input', ()=>{ applyPalette(primaryPicker.value, secondaryPicker.value); });
stripePicker.addEventListener('input', ()=>{ if(window.updateThreeColors) window.updateThreeColors(primaryPicker.value, secondaryPicker.value, stripePicker.value); });

// set initial from pickers
applyPalette(primaryPicker.value, secondaryPicker.value);

// ---------- Three.js 3D stripes + dots (fast/dynamic by default) ----------
const container = document.getElementById('threeContainer');
let scene, camera, renderer, stripes = [], dotMaterial, lineMaterial;
initThree();
animate();

function initThree(){
  scene = new THREE.Scene();
  const fov = 60; const aspect = innerWidth/innerHeight; camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 5000);
  camera.position.set(0, 30, 220);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // lighting
  const amb = new THREE.AmbientLight(0xffffff, 0.6); scene.add(amb);
  const dir = new THREE.DirectionalLight(0xffffff, 0.6); dir.position.set(0,50,100); scene.add(dir);

  // materials
  const primary = new THREE.Color(primaryPicker.value);
  const secondary = new THREE.Color(secondaryPicker.value);
  dotMaterial = new THREE.MeshStandardMaterial({color:primary, emissive:primary, emissiveIntensity:0.9, metalness:0.1, roughness:0.3});
  lineMaterial = new THREE.LineBasicMaterial({color:secondary, transparent:true, opacity:0.9});

  // create several sinusoidal stripes (curved lines) across Z axis
  const stripeCount = 6; // number of stripes
  for(let i=0;i<stripeCount;i++){
    const points = [];
    const segments = 200;
    const spread = 260; // across X
    const zBase = -200 + i*(80);
    for(let j=0;j<segments;j++){
      const t = j/(segments-1);
      const x = (t-0.5)*spread;
      const y = Math.sin(t*6 + i*1.2)*18 + (i-3)*6;
      const z = zBase + Math.cos(t*3 + i*0.7)*30;
      points.push(new THREE.Vector3(x,y,z));
    }
    // line geometry
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    const line = new THREE.Line(geom, lineMaterial.clone());
    line.material.opacity = 0.25 + (i/stripeCount)*0.6;
    scene.add(line);

    // dots: create small spheres along the line
    const dotGroup = new THREE.Group();
    for(let k=0;k<points.length;k+=6){ // sample every Nth point
      const sGeom = new THREE.SphereGeometry(0.9, 8, 8);
      const mesh = new THREE.Mesh(sGeom, dotMaterial.clone());
      mesh.position.copy(points[k]);
      dotGroup.add(mesh);
    }
    scene.add(dotGroup);
    stripes.push({line, dots:dotGroup, speed: 0.6 + Math.random()*1.6, phase:Math.random()*10});
  }

  // subtle fog
  scene.fog = new THREE.FogExp2(0x010005, 0.0012);

  // responsiveness
  window.addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  // allow pointer to influence
  let px = 0, py = 0;
  window.addEventListener('mousemove', (e)=>{ px = (e.clientX / innerWidth - 0.5)*2; py = (e.clientY / innerHeight -0.5)*-2; });
  // store for animate
  initThree._px = () => ({px,py});
}

function animate(time){
  requestAnimationFrame(animate);
  // fast/dynamic default movement
  const t = (time || 0) * 0.002;
  const p = initThree._px();
  // subtle camera movement based on pointer and time
  camera.position.x += (p.px*40 - camera.position.x) * 0.06;
  camera.position.y += (p.py*30 + 10 - camera.position.y) * 0.06;
  camera.lookAt(0,0,0);

  // animate stripes: move vertices and dots
  stripes.forEach((s, idx)=>{
    const geom = s.line.geometry;
    const pos = geom.attributes.position.array;
    const vcount = pos.length/3;
    for(let i=0;i<vcount;i++){
      const ix = i*3, iy = ix+1, iz = ix+2;
      const baseX = pos[ix];
      // create a wave motion along y and z
      pos[iy] = Math.sin((i*0.12) + t*s.speed + s.phase)*12 + (idx-2)*4;
      pos[iz] = Math.cos((i*0.07) + t*s.speed*0.8 + s.phase)*28 + (-200 + idx*80);
    }
    geom.attributes.position.needsUpdate = true;

    // animate dots positions slightly along their original paths
    s.dots.children.forEach((dot, di)=>{
      const base = dot.position;
      dot.position.y = base.y + Math.sin(t*s.speed + di*0.3 + s.phase)*4;
      dot.position.x = base.x + Math.cos(t*s.speed*0.7 + di*0.11 + s.phase)*2;
      dot.material.emissiveIntensity = 0.6 + Math.abs(Math.sin(t + di))*0.7;
    });
  });

  renderer.render(scene, camera);
}

// allow update of materials when colors change
window.updateThreeColors = function(primaryHex, secondaryHex, stripeHex){
  try{
    const p = new THREE.Color(primaryHex);
    const s = new THREE.Color(secondaryHex);
    const st = new THREE.Color(stripeHex);
    // update dot and line materials
    scene.traverse(obj=>{
      if(obj.isMesh && obj.material){ obj.material.color.set(p); if(obj.material.emissive) obj.material.emissive.set(p); }
      if(obj.isLine && obj.material){ obj.material.color.set(s); }
    });
  }catch(e){ console.warn('Error updating colors', e); }
}

// apply widgets to three on initial load
applyPalette(primaryPicker.value, secondaryPicker.value);
if(window.updateThreeColors) window.updateThreeColors(primaryPicker.value, secondaryPicker.value, stripePicker.value);

  </script>
</body>
</html>
