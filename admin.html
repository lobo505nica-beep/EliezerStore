<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN JEFE - Eliezer Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');
body{background:#050a1a;color:#fff;font-family:Montserrat;padding:15px}
h1{color:#ef4444;text-align:center;font-family:Orbitron}
.section{background:#0f172a;padding:20px;border-radius:15px;margin-bottom:20px;border:2px solid #ef4444}
input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#1e293b;border:1px solid #334155;border-radius:8px;color:white}
button{width:100%;padding:12px;background:#ef4444;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-verde{background:#22c55e}.btn-rojo{background:#ef4444}.btn-naranja{background:#f59e0b}.btn-azul{background:#3b82f6}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}th,td{border:1px solid #1e293b;padding:8px}
th{background:#1e293b;color:#ef4444}.badge{background:#ef4444;color:white;padding:5px 10px;border-radius:20px;font-size:12px}
.solicitud{background:#1e293b;padding:15px;margin:10px 0;border-radius:8px;border-left:4px solid #f59e0b}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head>
<body><h1>👑 PANEL JEFE - ELIEZER STORE</h1>

<div class="section"><h2><span class="badge">TOTAL</span> GANANCIAS: $<span id="total-ganancias">0</span></h2></div>

<div class="section"><h2>1. SOLICITUDES DE SOCIOS PENDIENTES</h2><div id="lista-solicitudes"></div></div>

<div class="section"><h2>2. RECARGAR SALDO</h2>
<input id="rec-id" placeholder="ID Cliente/Socio Ej: ELZ123456">
<input id="rec-monto" type="number" placeholder="Monto $">
<button class="btn-naranja" onclick="recargarSaldo()">💰 RECARGAR</button>
<p id="rec-msg" style="color:#22c55e"></p></div>

<div class="section"><h2>3. BANEAR / DESBANEAR CUENTA</h2>
<input id="ban-id" placeholder="Pega el ID a banear Ej: ELZ123456">
<button class="btn-rojo" onclick="banearCuenta()">🚫 BANEAR CUENTA</button>
<button class="btn-verde" onclick="desbanearCuenta()">✅ DESBANEAR CUENTA</button></div>

<div class="section"><h2>4. AGREGAR PRODUCTO</h2>
<input id="prod-nombre" placeholder="Nombre del Producto">
<textarea id="prod-desc" placeholder="Descripción"></textarea>
<div class="grid-2"><input id="prod-precio-publico" type="number" placeholder="Precio Público $"><input id="prod-precio-socio" type="number" placeholder="Precio Socio $"></div>
<input id="prod-cat" placeholder="Categoría: Ej: Bot, Página Web, Servicio, IA, Diseño" value="Bot">
<button class="btn-verde" onclick="agregarProducto()">AGREGAR PRODUCTO</button></div>

<div class="section"><h2>5. TODOS LOS USUARIOS</h2><table id="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>ID</th><th>Saldo</th><th>Estado</th></tr></thead><tbody></tbody></table></div>

<div class="section"><h2>6. TODOS LOS PEDIDOS</h2><table id="tabla-pedidos"><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Precio</th><th>Vendido por</th></tr></thead><tbody></tbody></table></div>

<script>
const get=(k)=>JSON.parse(localStorage.getItem(k))||[];const set=(k,d)=>localStorage.setItem(k,JSON.stringify(d));
const generarID = () => 'ELZ' + Math.floor(100000 + Math.random() * 900000);

window.onload=cargarTodo;
function cargarTodo(){cargarUsuarios();cargarPedidos();cargarSolicitudes();calcularGanancias()}

function calcularGanancias(){let p=get('elz_pedidos').filter(x=>x.tipo==="Pago");let total=p.reduce((a,b)=>a+b.precio,0);document.getElementById('total-ganancias').innerText=total.toFixed(2)}

function cargarSolicitudes(){let s=get('elz_solicitudes_socios');let d=document.getElementById('lista-solicitudes');d.innerHTML='';if(s.length===0)d.innerHTML='<p style="color:#94a3b8">No hay solicitudes pendientes</p>';
s.forEach(x=>d.innerHTML+=`<div class="solicitud"><p><b>Nombre:</b> ${x.nombre}</p><p><b>Email:</b> ${x.email}</p><p><b>Pass:</b> ${x.pass}</p><button class="btn-verde" onclick="aceptarSocio(${x.id})">ACEPTAR Y CREAR ID</button><button class="btn-rojo" onclick="rechazarSocio(${x.id})">RECHAZAR</button></div>`)}

function aceptarSocio(id){let s=get('elz_solicitudes_socios');let sol=s.find(x=>x.id===id);let u=get('elz_usuarios');let nuevoID = generarID();
u.push({id:Date.now(),nombre:sol.nombre,email:sol.email,pass:sol.pass,saldo:0,idRecarga:nuevoID,baneado:false});
set('elz_usuarios',u);set('elz_solicitudes_socios',s.filter(x=>x.id!==id));alert('Socio ACEPTADO! \nID: '+nuevoID);cargarSolicitudes();cargarUsuarios()}

function rechazarSocio(id){set('elz_solicitudes_socios',get('elz_solicitudes_socios').filter(x=>x.id!==id));alert('Solicitud rechazada');cargarSolicitudes()}

function banearCuenta(){let id=document.getElementById('ban-id').value.toUpperCase();let u=get('elz_usuarios');let i=u.findIndex(x=>x.idRecarga===id);if(i===-1)return alert('ID no encontrado');u[i].baneado=true;set('elz_usuarios',u);alert('Cuenta baneada');cargarUsuarios();localStorage.setItem('update',Date.now())}

function desbanearCuenta(){let id=document.getElementById('ban-id').value.toUpperCase();let u=get('elz_usuarios');let i=u.findIndex(x=>x.idRecarga===id);if(i===-1)return alert('ID no encontrado');u[i].baneado=false;set('elz_usuarios',u);alert('Cuenta desbaneada');cargarUsuarios()}

function cargarUsuarios(){let u=get('elz_usuarios');let t=document.querySelector('#tabla-usuarios tbody');t.innerHTML='';u.forEach(x=>t.innerHTML+=`<tr><td>${x.nombre}</td><td>${x.email}</td><td style="color:#3b82f6">${x.idRecarga}</td><td style="color:#22c55e">$${x.saldo.toFixed(2)}</td><td>${x.baneado?'<span style="color:#ef4444">BANEADO</span>':'<span style="color:#22c55e">ACTIVO</span>'}</td></tr>`)}

function cargarPedidos(){let p=get('elz_pedidos').filter(x=>x.tipo!=="Pedido Personalizado");let t=document.querySelector('#tabla-pedidos tbody');t.innerHTML='';p.reverse().forEach(x=>t.innerHTML+=`<tr><td>${x.fecha}</td><td>${x.cliente}</td><td>${x.producto}</td><td>$${x.precio}</td><td>${x.vendedor||'JEFE'}</td></tr>`)}

function agregarProducto(){let n=document.getElementById('prod-nombre').value;let d=document.getElementById('prod-desc').value;let pp=document.getElementById('prod-precio-publico').value;let ps=document.getElementById('prod-precio-socio').value;let c=document.getElementById('prod-cat').value;if(!n||!pp||!ps||!c)return alert('Llena todo');let p=get('elz_productos');p.push({id:Date.now(),nombre:n,descripcion:d,precioPublico:parseFloat(pp),precioSocio:parseFloat(ps),categoria:c});set('elz_productos',p);alert('Producto Agregado');document.getElementById('prod-nombre').value='';document.getElementById('prod-desc').value='';document.getElementById('prod-precio-publico').value='';document.getElementById('prod-precio-socio').value=''}

function recargarSaldo(){let id=document.getElementById('rec-id').value;let m=parseFloat(document.getElementById('rec-monto').value);if(!id||!m)return alert('Llena campos');let u=get('elz_usuarios');let i=u.findIndex(x=>x.idRecarga===id);if(i===-1)return alert('ID no encontrado');u[i].saldo+=m;set('elz_usuarios',u);localStorage.setItem('update',Date.now());document.getElementById('rec-msg').innerText=`Saldo de ${u[i].nombre}: $${u[i].saldo.toFixed(2)}`;document.getElementById('rec-id').value='';document.getElementById('rec-monto').value='';cargarUsuarios()}
</script></body></html>
