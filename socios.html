<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PANEL SOCIO - Eliezer Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#050a1a;color:#fff}
header{background:#0f172a;padding:15px 4%;border-bottom:3px solid #f59e0b;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:#f59e0b}
.badge-socio{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px}
.btn-salir{background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}
.container{padding:20px 4%}
.section{background:#0f172a;padding:20px;border-radius:15px;margin-bottom:20px;border:2px solid #f59e0b}
.section-title{font-size:20px;font-weight:900;margin-bottom:15px;font-family:'Orbitron',sans-serif;color:#f59e0b}
.resumen{background:#1e293b;padding:15px;border-radius:10px;text-align:center;margin-bottom:15px}
.resumen .numero{font-size:32px;font-weight:900;color:#22c55e;font-family:Orbitron}
.input-id{background:#0f172a;padding:30px;border-radius:15px;border:2px solid #f59e0b;text-align:center;max-width:400px;margin:50px auto}
.input-id input{width:100%;padding:14px;margin:10px 0;background:#1e293b;border:2px solid #334155;border-radius:10px;color:white;font-size:16px;font-family:Orbitron;text-align:center}
.input-id button{width:100%;padding:14px;background:#f59e0b;color:#000;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th,td{border-bottom:1px solid #1e293b;padding:10px;text-align:left}
th{background:#1e293b;color:#f59e0b}
.card-producto{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:10px}
.card-producto h4{color:#f59e0b}
.badge{background:#f59e0b;color:#000;padding:4px 8px;border-radius:15px;font-size:10px;font-weight:900}
</style>
</head>
<body>

<header>
    <div class="logo">SOCIO<span> PANEL</span></div>
    <div style="display:flex;gap:10px;align-items:center">
        <div class="badge-socio" id="badgeSocio" style="display:none">⭐ SOCIO</div>
        <button class="btn-salir" id="btnSalir" onclick="salir()" style="display:none">SALIR</button>
    </div>
</header>

<div class="container">
    <div class="input-id" id="pedir-id">
        <h2>ACCESO SOCIO</h2>
        <p style="color:#94a3b8;margin-bottom:15px">Ingresa tu ID de Socio para ver tu panel</p>
        <input id="input-id-socio" placeholder="Ej: ELZ123456" maxlength="9">
        <button onclick="entrarConID()">ENTRAR</button>
        <p id="error-id" style="color:#ef4444;margin-top:10px"></p>
    </div>

    <div id="panel-socio" style="display:none">
        <div class="resumen">
            <p style="color:#94a3b8;font-size:12px">MIS VENTAS REALIZADAS</p>
            <p class="numero" id="mis-ventas">0</p>
            <p style="color:#94a3b8;font-size:12px">MI ID: <b id="mi-id-socio" style="color:#3b82f6"></b></p>
        </div>

        <div class="section">
            <h2 class="section-title">1. USUARIOS REGISTRADOS</h2>
            <table id="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>ID</th><th>Saldo</th></tr></thead><tbody></tbody></table>
        </div>

        <div class="section">
            <h2 class="section-title">2. CATÁLOGO DE PRODUCTOS</h2>
            <div id="lista-productos-socio"></div>
        </div>

        <div class="section">
            <h2 class="section-title">3. HISTORIAL DE MIS VENTAS</h2>
            <table id="tabla-ventas"><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Precio</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>

<script>
const get = (k) => JSON.parse(localStorage.getItem(k)) || [];
let idSocioActual = null;

window.onload = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if(id) {
        document.getElementById('input-id-socio').value = id;
        entrarConID();
    }
}

function entrarConID(){
    let id = document.getElementById('input-id-socio').value.toUpperCase();
    let usuarios = get('elz_usuarios');
    let socio = usuarios.find(u => u.idRecarga === id);
    
    if(!socio) {
        document.getElementById('error-id').innerText = "ID no encontrado";
        return;
    }
    
    idSocioActual = id;
    document.getElementById('pedir-id').style.display = 'none';
    document.getElementById('panel-socio').style.display = 'block';
    document.getElementById('badgeSocio').style.display = 'block';
    document.getElementById('btnSalir').style.display = 'block';
    document.getElementById('mi-id-socio').innerText = id;
    
    cargarUsuarios();
    cargarProductos();
    cargarVentas();
}

function salir(){
    idSocioActual = null;
    document.getElementById('panel-socio').style.display = 'none';
    document.getElementById('pedir-id').style.display = 'block';
    document.getElementById('badgeSocio').style.display = 'none';
    document.getElementById('btnSalir').style.display = 'none';
    document.getElementById('input-id-socio').value = '';
}

function cargarUsuarios(){
    let u = get('elz_usuarios');
    let t = document.querySelector('#tabla-usuarios tbody');
    t.innerHTML = '';
    u.forEach(x => {
        t.innerHTML += `<tr><td>${x.nombre}</td><td>${x.email}</td><td style="color:#3b82f6">${x.idRecarga}</td><td style="color:#22c55e">$${x.saldo.toFixed(2)}</td></tr>`
    })
}

function cargarProductos(){
    let p = get('elz_productos');
    let d = document.getElementById('lista-productos-socio');
    d.innerHTML = '';
    p.forEach(x => {
        d.innerHTML += `<div class="card-producto"><span class="badge">${x.categoria}</span><h4>${x.nombre}</h4><p style="color:#94a3b8;font-size:13px">${x.descripcion}</p><p><b>Precio Público:</b> $${x.precioPublico} | <b>Precio Socio:</b> $${x.precioSocio}</p></div>`
    })
}

function cargarVentas(){
    let p = get('elz_pedidos').filter(x => x.tipo === "Pago" && x.idVendedor === idSocioActual);
    let t = document.querySelector('#tabla-ventas tbody');
    t.innerHTML = '';
    p.reverse().forEach(x => {
        t.innerHTML += `<tr><td>${x.fecha}</td><td>${x.cliente}</td><td>${x.producto}</td><td>$${x.precioPublico}</td></tr>`
    })
    document.getElementById('mis-ventas').innerText = p.length;
}

window.addEventListener('storage', e => {
    if(e.key === 'elz_pedidos' && idSocioActual) cargarVentas();
    if(e.key === 'elz_usuarios' && idSocioActual) cargarUsuarios();
})
</script>
</body></html>
