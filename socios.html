<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PANEL SOCIO - Eliezer Store</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#050a1a;color:#fff}
header{background:#0f172a;padding:15px 4%;border-bottom:3px solid #f59e0b;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:#f59e0b}
.container{padding:20px 4%}
.section{background:#0f172a;padding:20px;border-radius:15px;margin-bottom:20px;border:2px solid #f59e0b}
.section-title{font-size:20px;font-weight:900;margin-bottom:15px;font-family:'Orbitron',sans-serif;color:#f59e0b}
.resumen{background:#1e293b;padding:15px;border-radius:10px;text-align:center;margin-bottom:15px}
.resumen .numero{font-size:32px;font-weight:900;color:#22c55e;font-family:Orbitron}
.login-socio{background:#0f172a;padding:30px;border-radius:15px;border:2px solid #f59e0b;text-align:center;max-width:400px;margin:50px auto}
.login-socio input{width:100%;padding:14px;margin:10px 0;background:#1e293b;border:2px solid #334155;border-radius:10px;color:white;font-size:16px}
.login-socio button{width:100%;padding:14px;background:#f59e0b;color:#000;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th,td{border-bottom:1px solid #1e293b;padding:10px;text-align:left}
th{background:#1e293b;color:#f59e0b}
.card-producto{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:10px}
.card-producto h4{color:#f59e0b}
.badge{background:#f59e0b;color:#000;padding:4px 8px;border-radius:15px;font-size:10px;font-weight:900}
.btn-salir{background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-rojo{background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}
.btn-verde{background:#22c55e;color:white;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>

<header><div class="logo">SOCIO<span> PANEL</span></div><button class="btn-salir" id="btnSalir" onclick="salir()" style="display:none">SALIR</button></header>

<div class="container">
    <div class="login-socio" id="login-socio">
        <h2>SOLICITAR ACCESO SOCIO</h2>
        <p style="color:#94a3b8;font-size:13px;margin-bottom:15px">Pon tus datos 1 sola vez. Cuando el admin te acepte, entrarás automático.</p>
        <input id="socio-nombre" placeholder="Tu Nombre Completo">
        <input id="socio-email" type="email" placeholder="Tu Correo">
        <input id="socio-pass" type="password" placeholder="Crea una Contraseña">
        <button onclick="solicitarRegistro()">📨 SOLICITAR REGISTRO</button>
        <p id="msg-socio" style="color:#22c55e;margin-top:10px"></p>
    </div>

    <div id="panel-socio" style="display:none">
        <div class="resumen"><p style="color:#94a3b8;font-size:12px">MIS VENTAS REALIZADAS</p><p class="numero" id="mis-ventas">0</p><p style="color:#94a3b8;font-size:12px">MI ID: <b id="mi-id-socio" style="color:#3b82f6"></b></p></div>

        <div class="section">
            <h2 class="section-title">AGREGAR MI PRODUCTO</h2>
            <input id="prod-nombre" placeholder="Nombre del Producto">
            <textarea id="prod-desc" placeholder="Descripción" style="width:100%;padding:12px;margin:8px 0;background:#1e293b;border:1px solid #334155;border-radius:8px;color:white"></textarea>
            <div class="grid-2"><input id="prod-precio-publico" type="number" placeholder="Precio Público $"><input id="prod-precio-socio" type="number" placeholder="Precio Socio $"></div>
            <input id="prod-cat" placeholder="Categoría: Ej: Bot, Servicio, Diseño" value="Servicio">
            <button class="btn-verde" onclick="agregarProductoSocio()">➕ AGREGAR PRODUCTO</button>
        </div>

        <div class="section"><h2 class="section-title">MIS PRODUCTOS</h2><div id="lista-productos-socio"></div></div>

        <div class="section"><h2 class="section-title">USUARIOS REGISTRADOS</h2><table id="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>ID</th><th>Saldo</th></tr></thead><tbody></tbody></table></div>

        <div class="section"><h2 class="section-title">HISTORIAL DE MIS VENTAS</h2><table id="tabla-ventas"><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
    </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbJy6E0nDuOQtPgDthl2CZFHNwt2wwMds",
  authDomain: "eliezer-store-95bc1.firebaseapp.com",
  databaseURL: "https://eliezer-store-95bc1-default-rtdb.firebaseio.com",
  projectId: "eliezer-store-95bc1",
  storageBucket: "eliezer-store-95bc1.firebasestorage.app",
  messagingSenderId: "449914306593",
  appId: "1:449914306593:web:1388b96ce081a5e11b6360"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let idSocioActual = localStorage.getItem('socio_id'); 

window.onload = () => {
    revisarSiYaFueAceptado();
    db.ref('usuarios').on('value', cargarUsuarios);
    db.ref('pedidos').on('value', cargarVentas);
    db.ref('productos').on('value', cargarMisProductos);
}

function revisarSiYaFueAceptado(){
    if(!idSocioActual) return;
    db.ref('socios/'+idSocioActual).once('value').then(snap=>{
        if(snap.exists()){ // YA FUI ACEPTADO
            if(snap.val().baneado){document.getElementById('msg-socio').innerText="🚫 Cuenta baneada";return}
            entrarPanel(snap.val());
        } else {
            // SIGO PENDIENTE
            db.ref('solicitudes_socios/'+idSocioActual).once('value').then(s=>{
                if(s.exists()){
                    document.getElementById('msg-socio').innerText="⏳ Tu solicitud está pendiente. El admin aún no te ha aceptado.";
                    document.getElementById('socio-nombre').value=s.val().nombre;
                    document.getElementById('socio-email').value=s.val().email;
                    document.getElementById('socio-pass').value=s.val().pass;
                }
            });
        }
    });
}

function solicitarRegistro(){
    let n=document.getElementById('socio-nombre').value;
    let e=document.getElementById('socio-email').value;
    let p=document.getElementById('socio-pass').value;
    if(!n||!e||!p){document.getElementById('msg-socio').innerText="Llena todos los campos";return}
    
    let id = Date.now();
    localStorage.setItem('socio_id', id); // Guardo mi id para entrar solo
    db.ref('solicitudes_socios/'+id).set({nombre:n,email:e,pass:p});
    document.getElementById('msg-socio').innerText="✅ Solicitud enviada! Cierra esta página y vuelve a abrirla cuando el admin te acepte.";
}

function entrarPanel(u){
    idSocioActual = u.idRecarga;
    localStorage.setItem('socio_id', idSocioActual);
    document.getElementById('login-socio').style.display='none';
    document.getElementById('panel-socio').style.display='block';
    document.getElementById('btnSalir').style.display='block';
    document.getElementById('mi-id-socio').innerText=u.idRecarga;
    document.getElementById('msg-socio').innerText="";
}

function salir(){
    localStorage.removeItem('socio_id');
    idSocioActual=null;
    location.reload();
}

function cargarUsuarios(){
    db.ref('usuarios').once('value').then(s=>{
        let t=document.querySelector('#tabla-usuarios tbody');t.innerHTML='';
        s.forEach(x=>{let u=x.val(); t.innerHTML+=`<tr><td>${u.nombre}</td><td>${u.email}</td><td style="color:#3b82f6">${u.idRecarga}</td><td style="color:#22c55e">$${u.saldo.toFixed(2)}</td></tr>`})
    });
}

function cargarVentas(){
    db.ref('pedidos').once('value').then(s=>{
        let ventas = [];
        s.forEach(x=>{if(x.val().tipo==="Pago" && x.val().idVendedor===idSocioActual) ventas.push(x.val())});
        let t=document.querySelector('#tabla-ventas tbody');t.innerHTML='';
        ventas.reverse().forEach(x=>{t.innerHTML+=`<tr><td>${x.fecha}</td><td>${x.cliente}</td><td>${x.producto}</td><td>$${x.precio}</td></tr>`})
        document.getElementById('mis-ventas').innerText=ventas.length;
    });
}

function cargarMisProductos(){
    db.ref('productos').once('value').then(s=>{
        let d=document.getElementById('lista-productos-socio');d.innerHTML='';
        let hay = false;
        s.forEach(x=>{ 
            if(x.val().idVendedor === idSocioActual){
                hay = true;
                let p = x.val();
                d.innerHTML+=`<div class="card-producto">
                    <span class="badge">${p.categoria}</span>
                    <h4>${p.nombre}</h4>
                    <p style="color:#94a3b8;font-size:13px">${p.descripcion}</p>
                    <p><b>Público:</b> $${p.precioPublico} | <b>Socio:</b> $${p.precioSocio}</p>
                    <button class="btn-rojo" onclick="borrarMiProducto('${x.key}')">BORRAR</button>
                </div>`
            }
        });
        if(!hay) d.innerHTML = '<p style="color:#94a3b8">No has agregado productos aún</p>';
    });
}

function agregarProductoSocio(){
    let n=document.getElementById('prod-nombre').value;
    let d=document.getElementById('prod-desc').value;
    let pp=document.getElementById('prod-precio-publico').value;
    let ps=document.getElementById('prod-precio-socio').value;
    let c=document.getElementById('prod-cat').value;
    if(!n||!pp||!ps||!c)return alert('Llena todo');

    db.ref('productos').push({nombre:n,descripcion:d,precioPublico:parseFloat(pp),precioSocio:parseFloat(ps),categoria:c,idVendedor:idSocioActual});
    alert('Producto Agregado a tu catálogo!');
    document.getElementById('prod-nombre').value='';document.getElementById('prod-desc').value='';document.getElementById('prod-precio-publico').value='';document.getElementById('prod-precio-socio').value='';
}

function borrarMiProducto(id){
    if(!confirm('¿Seguro que quieres borrar este producto?'))return;
    db.ref('productos/'+id).remove();
}
</script>
</body></html>
