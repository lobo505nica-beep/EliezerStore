<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PANEL SOCIO - Eliezer Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#050a1a;color:#fff}
header{background:#0f172a;padding:15px 4%;border-bottom:3px solid #f59e0b;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:#f59e0b}
.container{padding:20px 4%}
.section{background:#0f172a;padding:20px;border-radius:15px;margin-bottom:20px;border:2px solid #f59e0b}
.section-title{font-size:20px;font-weight:900;margin-bottom:15px;font-family:'Orbitron',sans-serif;color:#f59e0b}
.resumen{background:#1e293b;padding:15px;border-radius:10px;text-align:center;margin-bottom:15px}
.resumen .numero{font-size:32px;font-weight:900;color:#22c55e;font-family:Orbitron}
.login-socio{background:#0f172a;padding:30px;border-radius:15px;border:2px solid #f59e0b;text-align:center;max-width:400px;margin:50px auto}
.login-socio input{width:100%;padding:14px;margin:10px 0;background:#1e293b;border:2px solid #334155;border-radius:10px;color:white;font-size:16px}
.login-socio button{width:100%;padding:14px;background:#f59e0b;color:#000;border:none;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th,td{border-bottom:1px solid #1e293b;padding:10px;text-align:left}
th{background:#1e293b;color:#f59e0b}
.btn-salir{background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<header><div class="logo">SOCIO<span> PANEL</span></div><button class="btn-salir" id="btnSalir" onclick="salir()" style="display:none">SALIR</button></header>

<div class="container">
    <div class="login-socio" id="login-socio">
        <h2>ACCESO SOCIO</h2>
        <input id="socio-nombre" placeholder="Tu Nombre Completo">
        <input id="socio-email" type="email" placeholder="Tu Correo">
        <input id="socio-pass" type="password" placeholder="Crea una Contraseña">
        <button onclick="solicitarRegistro()">📨 SOLICITAR REGISTRO</button>
        <button onclick="entrarSocio()" style="background:#3b82f6;color:white">ENTRAR SI YA FUI ACEPTADO</button>
        <p id="msg-socio" style="color:#22c55e;margin-top:10px"></p>
    </div>

    <div id="panel-socio" style="display:none">
        <div class="resumen"><p style="color:#94a3b8;font-size:12px">MIS VENTAS REALIZADAS</p><p class="numero" id="mis-ventas">0</p><p style="color:#94a3b8;font-size:12px">MI ID: <b id="mi-id-socio" style="color:#3b82f6"></b></p></div>
        <div class="section"><h2 class="section-title">USUARIOS REGISTRADOS</h2><table id="tabla-usuarios"><thead><tr><th>Nombre</th><th>Email</th><th>ID</th><th>Saldo</th></tr></thead><tbody></tbody></table></div>
        <div class="section"><h2 class="section-title">HISTORIAL DE MIS VENTAS</h2><table id="tabla-ventas"><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
    </div>
</div>

<script>
const get = (k) => JSON.parse(localStorage.getItem(k)) || [];
const set = (k,d) => localStorage.setItem(k, JSON.stringify(d));
let idSocioActual = null;

function solicitarRegistro(){
    let n=document.getElementById('socio-nombre').value;
    let e=document.getElementById('socio-email').value;
    let p=document.getElementById('socio-pass').value;
    if(!n||!e||!p){document.getElementById('msg-socio').innerText="Llena todos los campos";return}
    
    let s=get('elz_solicitudes_socios');
    if(s.find(x=>x.email===e)){document.getElementById('msg-socio').innerText="Ya tienes una solicitud pendiente";return}
    
    s.push({id:Date.now(),nombre:n,email:e,pass:p});
    set('elz_solicitudes_socios',s);
    document.getElementById('msg-socio').innerText="Solicitud enviada! Espera a que el admin te acepte";
    document.getElementById('socio-nombre').value='';document.getElementById('socio-email').value='';document.getElementById('socio-pass').value='';
}

function entrarSocio(){
    let e=document.getElementById('socio-email').value;
    let p=document.getElementById('socio-pass').value;
    let u=get('elz_usuarios').find(x=>x.email===e && x.pass===p);
    
    if(!u){document.getElementById('msg-socio').innerText="No estás aceptado o datos incorrectos";return}
    if(u.baneado){document.getElementById('msg-socio').innerText="🚫 Cuenta baneada";return}
    
    idSocioActual = u.idRecarga;
    document.getElementById('login-socio').style.display='none';
    document.getElementById('panel-socio').style.display='block';
    document.getElementById('btnSalir').style.display='block';
    document.getElementById('mi-id-socio').innerText=u.idRecarga;
    cargarUsuarios();cargarVentas();
}

function salir(){
    idSocioActual=null;
    document.getElementById('panel-socio').style.display='none';
    document.getElementById('login-socio').style.display='block';
    document.getElementById('btnSalir').style.display='none';
}

function cargarUsuarios(){let u=get('elz_usuarios');let t=document.querySelector('#tabla-usuarios tbody');t.innerHTML='';u.forEach(x=>t.innerHTML+=`<tr><td>${x.nombre}</td><td>${x.email}</td><td style="color:#3b82f6">${x.idRecarga}</td><td style="color:#22c55e">$${x.saldo.toFixed(2)}</td></tr>`)}

function cargarVentas(){
    let p=get('elz_pedidos').filter(x=>x.tipo==="Pago" && x.idVendedor===idSocioActual);
    let t=document.querySelector('#tabla-ventas tbody');t.innerHTML='';
    p.reverse().forEach(x=>{t.innerHTML+=`<tr><td>${x.fecha}</td><td>${x.cliente}</td><td>${x.producto}</td><td>$${x.precioPublico}</td></tr>`})
    document.getElementById('mis-ventas').innerText=p.length;
}

window.addEventListener('storage', e => {
    if(idSocioActual){
        if(e.key === 'elz_pedidos') cargarVentas();
        if(e.key === 'elz_usuarios') cargarUsuarios();
    }
})
</script>
</body></html>
