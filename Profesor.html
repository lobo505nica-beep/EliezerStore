<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Profesor - RRT</title>
<style>
body{font-family:Arial;background:#f0f4f8;margin:0;padding:20px}
h1{text-align:center;color:#0d47a1;margin-bottom:10px}
.subtitulo{text-align:center;color:#555;margin-bottom:20px}
.contenedor{max-width:1400px;margin:0 auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 20px #0002}
.tabla-contenedor{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px;min-width:1000px}
th,td{padding:12px;border:1px solid #ddd;text-align:center}
th{background:#1976d2;color:#fff;position:sticky;top:0}
tr:hover{background:#e3f2fd}
.ganadas{color:#2E8B57;font-weight:bold}
.perdidas{color:#d32f2f;font-weight:bold}
.btn{padding:10px 20px;background:#1976d2;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:5px;font-weight:bold}
.btn:hover{background:#0d47a1}
.btn-eliminar{padding:8px 14px;background:#d32f2f;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;transition:0.2s}
.btn-eliminar:hover{background:#b71c1c;transform:scale(1.05)}
#loading{text-align:center;padding:40px;font-size:18px;color:#555}
.total{font-weight:bold;font-size:16px;margin:15px 0}
</style>
</head>
<body>

<h1>🎓 Panel del Profesor - Instituto RRT</h1>
<p class="subtitulo">Juego: Camino a la Escuela</p>

<div class="contenedor">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
    <h2>Estadísticas de Alumnos</h2>
    <div>
      <button class="btn" onclick="location.reload()">🔄 Actualizar</button>
    </div>
  </div>
  
  <p class="total" id="total">Total de alumnos: 0</p>
  <div id="loading">Cargando alumnos...</div>

  <div class="tabla-contenedor">
    <table id="tabla" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Grado</th>
          <th>Sección</th>
          <th>Veces Jugadas</th>
          <th class="ganadas">Ganadas</th>
          <th class="perdidas">Perdidas</th>
          <th>Última Nota</th>
          <th>Fecha Registro</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla">
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzu4rNjwLLQwt5BW9UxWvbMtD6JjR4Fa4",
  authDomain: "camino-a-la-escuela.firebaseapp.com",
  databaseURL: "https://camino-a-la-escuela-default-rtdb.firebaseio.com",
  projectId: "camino-a-la-escuela",
  storageBucket: "camino-a-la-escuela.firebasestorage.app",
  messagingSenderId: "113022794275",
  appId: "1:113022794275:web:c155955d9c61180f588f96"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// LEER ALUMNOS EN TIEMPO REAL
const alumnosRef = ref(db, 'alumnos_RRT/');
onValue(alumnosRef, (snapshot) => {
  const data = snapshot.val();
  const tbody = document.getElementById('cuerpoTabla');
  tbody.innerHTML = "";

  if(data){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tabla').style.display = 'table';

    let contador = 1;
    let total = Object.keys(data).length;
    document.getElementById('total').innerText = `Total de alumnos: ${total}`;

    Object.keys(data).forEach(key => {
      let a = data[key];
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${contador}</td>
        <td><b>${a.nombre}</b></td>
        <td>${a.grado}</td>
        <td>${a.seccion}</td>
        <td>${a.vecesJugadas}</td>
        <td class="ganadas">${a.vecesGanadas}</td>
        <td class="perdidas">${a.vecesPerdidas}</td>
        <td><b>${a.ultimaNota !== undefined ? a.ultimaNota : '-'}</b></td>
        <td>${a.fechaRegistro}</td>
        <td><button class="btn-eliminar" onclick="eliminarAlumno('${key}','${a.nombre}')">🗑️ Eliminar</button></td>
      `;
      tbody.appendChild(tr);
      contador++;
    });
  } else {
    document.getElementById('loading').innerText = "⚠️ Aún no hay alumnos registrados.";
    document.getElementById('total').innerText = `Total de alumnos: 0`;
  }
});

// FUNCION PARA ELIMINAR SOLO ESA CUENTA
window.eliminarAlumno = async function(id, nombre){
  if(confirm(`⚠️ ¿Seguro que quieres eliminar a ${nombre}?\nSe borrarán todos sus datos y será expulsado del juego.`)){
    try{
      await remove(ref(db, 'alumnos_RRT/'+id));
      alert(`Cuenta de ${nombre} eliminada correctamente.`);
    }catch(error){
      alert("Error al eliminar: "+error);
    }
  }
}
</script>
</body>
</html>
