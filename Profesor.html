<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Profesor - RRT</title>
<style>
body{font-family:Arial;background:#f0f4f8;margin:0;padding:20px}
h1{text-align:center;color:#0d47a1}
.contenedor{max-width:1000px;margin:20px auto;background:#fff;padding:30px;border-radius:15px;box-shadow:0 5px 20px #0002}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:12px;border:1px solid #ddd;text-align:center}
th{background:#1976d2;color:#fff}
tr:nth-child(even){background:#f5f5f5}
.nota100{color:#2E8B57;font-weight:bold}
.notaMal{color:#d32f2f;font-weight:bold}
#loading{text-align:center;padding:40px;font-size:18px}
.btn{padding:10px 20px;background:#1976d2;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:5px}
.btn:hover{background:#0d47a1}
</style>
</head>
<body>

<h1>🎓 Panel del Profesor - Instituto RRT</h1>
<div class="contenedor">
  <h2>Notas del Juego "Camino a la Escuela"</h2>
  <button class="btn" onclick="borrarNotas()">🗑️ Borrar Todas las Notas</button>
  <button class="btn" onclick="location.reload()">🔄 Actualizar</button>

  <div id="loading">Cargando notas...</div>

  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Grado</th>
        <th>Sección</th>
        <th>Aciertos</th>
        <th>Fallos</th>
        <th>Nota</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
    </tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzu4rNjwLLQwt5BW9UxWvbMtD6JjR4Fa4",
  authDomain: "camino-a-la-escuela.firebaseapp.com",
  databaseURL: "https://camino-a-la-escuela-default-rtdb.firebaseio.com",
  projectId: "camino-a-la-escuela",
  storageBucket: "camino-a-la-escuela.firebasestorage.app",
  messagingSenderId: "113022794275",
  appId: "1:113022794275:web:c155955d9c61180f588f96"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// LEER NOTAS EN TIEMPO REAL
const notasRef = ref(db, 'notas_RRT/');
onValue(notasRef, (snapshot) => {
  const data = snapshot.val();
  const tbody = document.getElementById('cuerpoTabla');
  tbody.innerHTML = "";

  if(data){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('tabla').style.display = 'table';

    let contador = 1;
    Object.keys(data).forEach(key => {
      let n = data[key];
      let tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${contador}</td>
        <td>${n.nombre}</td>
        <td>${n.grado}</td>
        <td>${n.seccion}</td>
        <td>${n.aciertos}/10</td>
        <td>${n.fallos}</td>
        <td class="${n.nota==100? 'nota100' : 'notaMal'}">${n.nota}</td>
        <td>${n.fecha}</td>
      `;
      tbody.appendChild(tr);
      contador++;
    });
  } else {
    document.getElementById('loading').innerText = "⚠️ Aún no hay notas. Que los alumnos jueguen primero.";
  }
});

window.borrarNotas = function(){
  if(confirm("¿Seguro que quieres borrar todas las notas?")){
    remove(notasRef);
    alert("Notas borradas");
  }
}
</script>
</body>
</html>
