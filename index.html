<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Eliezer</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <style>
    body{font-family:Arial;background:#111;color:#fff;padding:20px}
    .prod{background:#222;padding:15px;margin:10px;border-radius:10px}
    button{background:#00ff88;color:#000;border:0;padding:10px;border-radius:8px;cursor:pointer}
    input{padding:8px;border-radius:5px;border:0;margin:5px}
  </style>
</head>
<body>
<h1>🔥 Tienda Eliezer</h1>

<div id="auth">
  <input id="email" placeholder="Correo">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <button onclick="register()">Registrarse</button>
</div>

<div id="tienda" style="display:none">
  <h3>Saldo: $<span id="saldo">0</span></h3>
  <button onclick="logout()">Salir</button>
  <div id="productos"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDbJy6E0nDuOQtPgDthl2CZFHNwt2wwMds",
  authDomain: "eliezer-store-95bc1.firebaseapp.com",
  databaseURL: "https://eliezer-store-95bc1-default-rtdb.firebaseio.com",
  projectId: "eliezer-store-95bc1",
  storageBucket: "eliezer-store-95bc1.firebasestorage.app",
  messagingSenderId: "449914306593",
  appId: "1:449914306593:web:1388b96ce081a5e11b6360"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

let userId = null;

auth.onAuthStateChanged(user => {
  if(user){
    userId = user.uid;
    document.getElementById('auth').style.display='none';
    document.getElementById('tienda').style.display='block';
    cargarSaldo();
    cargarProductos();
  }
});

function register(){
  auth.createUserWithEmailAndPassword(email.value, pass.value)
  .then(u => db.ref('usuarios/'+u.user.uid).set({saldo:0, email:email.value}));
}
function login(){ auth.signInWithEmailAndPassword(email.value, pass.value); }
function logout(){ auth.signOut(); location.reload(); }

function cargarSaldo(){
  db.ref('usuarios/'+userId+'/saldo').on('value', snap => {
    document.getElementById('saldo').innerText = snap.val() || 0;
  });
}

function cargarProductos(){
  db.ref('productos').on('value', snap => {
    let html='';
    snap.forEach(p => {
      let prod = p.val();
      html += `<div class="prod">
        <h3>${prod.nombre}</h3>
        <p>${prod.descripcion}</p>
        <p>Precio: $${prod.precioPublico}</p>
        <button onclick="comprar('${p.key}',${prod.precioPublico})">Comprar</button>
      </div>`;
    });
    document.getElementById('productos').innerHTML=html;
  });
}

function comprar(id,precio){
  db.ref('usuarios/'+userId+'/saldo').once('value').then(snap=>{
    let saldo = snap.val() || 0;
    if(saldo >= precio){
      db.ref('usuarios/'+userId+'/saldo').set(saldo - precio);
      alert('Compra realizada!');
    }else alert('Saldo insuficiente');
  });
}
</script>
</body>
</html>
