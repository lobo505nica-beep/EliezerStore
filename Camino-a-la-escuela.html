<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Camino a la Escuela - RRT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
body{margin:0;font-family:'Inter';overflow:hidden;background:linear-gradient(180deg,#87CEEB 0%,#87CEEB 60%,#3cb371 60%)}
#login{display:flex;justify-content:center;align-items:center;height:100vh;background:#0d47a1}
.login-box{background:#fff;padding:40px;border-radius:16px;width:400px;text-align:center}
.login-box h2{color:#0d47a1}
.login-box input,.login-box select{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1.5px solid #ccc;font-size:16px}
.btn{width:100%;padding:14px;background:#1976d2;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:17px;cursor:pointer}
#juego{display:none;height:100vh;position:relative}
#escuela{position:absolute;right:40px;bottom:200px;font-size:80px}
#personaje{position:absolute;bottom:100px;left:40px;font-size:70px;transition:left 0.8s}
#calle{position:absolute;bottom:90px;width:100%;height:120px;background:#555}
#pregunta{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:#fff;padding:30px;border-radius:16px;width:600px;text-align:center}
.opcion{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:10px;background:#f5f5f5;font-size:16px;cursor:pointer}
.info{position:absolute;top:15px;left:15px;background:#fff;padding:10px 15px;border-radius:10px}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>🎓 Camino a la Escuela</h2>
    <p>Instituto Rodolfo Reyes Toruño</p>
    <input id="nombre" placeholder="Nombre Completo" required>
    <select id="grado" required><option value="">Grado</option><option>7mo</option><option>8vo</option><option>9no</option><option>10mo</option><option>11mo</option></select>
    <input id="seccion" placeholder="Sección A,B,C" required>
    <button class="btn" onclick="entrar()">IR AL JUEGO</button>
  </div>
</div>

<div id="juego">
  <div class="info"><b id="n"></b> - <span id="g"></span> <button onclick="location.reload()" style="margin-left:10px">Salir</button></div>
  <div id="escuela">🏫</div>
  <div id="personaje">🚶‍♂️</div>
  <div id="calle"></div>
  <div id="pregunta">
    <h3 id="texto">Cargando...</h3>
    <div id="ops"></div>
    <p id="prog">1 de 10</p>
  </div>
</div>

<script>
let estudiante={}, p=0, fallos=0, paso=0, usadas=[];
let preguntas=[
{q:"¿Qué es la interfaz de un software?",ops:["A. Código","B. Parte visual con botones","C. Compilador","D. Variable"],r:1},
{q:"¿Qué es un compilador?",ops:["A. Traduce código a máquina","B. Impresora","C. Antivirus","D. Navegador"],r:0},
{q:"¿Para qué sirve un IDE?",ops:["A. Jugar","B. Programar","C. Navegar","D. Dibujar"],r:1},
{q:"¿Qué figura es Inicio/Fin en diagrama?",ops:["A. Rectángulo","B. Óvalo","C. Rombo","D. Flecha"],r:1},
{q:"¿Qué es un Debugger?",ops:["A. Editor","B. Corrige errores","C. Navegador","D. Excel"],r:1},
{q:"¿Qué figura es una Decisión?",ops:["A. Óvalo","B. Rectángulo","C. Rombo","D. Círculo"],r:2},
{q:"¿Qué NO es parte de la interfaz?",ops:["A. Menú","B. Botón","C. CPU","D. Consola"],r:2},
{q:"¿Qué son los datos en un diagrama?",ops:["A. Procesos","B. Información que entra/sale","C. Flechas","D. Inicio"],r:1},
{q:"¿Qué herramienta escribe código?",ops:["A. Editor de código","B. Mouse","C. Monitor","D. Teclado"],r:0},
{q:"¿Qué hacen las flechas en un diagrama?",ops:["A. Procesos","B. Flujo de datos","C. Decisiones","D. Fin"],r:1}
];

function entrar(){
  estudiante.nombre=document.getElementById('nombre').value;
  estudiante.grado=document.getElementById('grado').value;
  estudiante.seccion=document.getElementById('seccion').value;
  if(estudiante.nombre==""||estudiante.grado==""||estudiante.seccion==""){alert("Completa todo");return;}
  document.getElementById('n').innerText=estudiante.nombre;
  document.getElementById('g').innerText=estudiante.grado+" "+estudiante.seccion;
  document.getElementById('login').style.display='none';
  document.getElementById('juego').style.display='block';
  siguiente();
}

function siguiente(){
  if(p>=10){if(fallos>0){alert("Fallaste "+fallos+". Reiniciando");p=0;fallos=0;paso=0;usadas=[];document.getElementById('personaje').style.left='40px'}else{alert("Ganaste "+estudiante.nombre+"!")}siguiente();return;}
  let i;do{i=Math.floor(Math.random()*preguntas.length)}while(usadas.includes(i));usadas.push(i);
  let pregunta=preguntas[i];
  document.getElementById('texto').innerText=pregunta.q;
  document.getElementById('prog').innerText="Pregunta "+(p+1)+" de 10";
  let cont=document.getElementById('ops');cont.innerHTML="";
  pregunta.ops.forEach((op,idx)=>{
    let b=document.createElement('button');b.className='opcion';b.innerText=op;
    b.onclick=()=>responder(idx==pregunta.r);
    cont.appendChild(b);
  });
}

function responder(correcta){
  if(correcta){
    document.getElementById('personaje').style.left=(40+((window.innerWidth-300)/10)*(paso+1))+'px';
    paso++;p++;setTimeout(siguiente,1000);
  }else{
    fallos++;p++;setTimeout(siguiente,1000);
  }
}
</script>
</body>
</html>
