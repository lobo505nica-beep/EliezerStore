<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camino a la Escuela - RRT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Arial';overflow:hidden;background:#000}
#login{display:flex;justify-content:center;align-items:center;height:100vh;width:100vw;background:linear-gradient(135deg,#0d47a1,#1976d2)}
.login-box{background:#fff;padding:40px;border-radius:20px;width:90%;max-width:450px;text-align:center;box-shadow:0 10px 40px #0005}
.login-box h2{color:#0d47a1;font-size:28px;margin-bottom:10px}
.login-box input,.login-box select{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:2px solid #ccc;font-size:16px}
.login-box input:focus,.login-box select:focus{outline:none;border-color:#1976d2}
.btn{width:100%;padding:15px;background:#1976d2;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;margin-top:10px;transition:0.3s}
.btn:hover{background:#0d47a1;transform:scale(1.02)}

#juego{display:none;height:100vh;width:100vw;position:relative;background:linear-gradient(180deg,#87CEEB 0%,#87CEEB 50%,#228B22 50%)}
#escuela{position:absolute;right:2%;bottom:18%;font-size:12vw;z-index:4}
#personaje{position:absolute;bottom:14%;left:3%;font-size:11vw;transition:left 1s ease-in-out;z-index:5;filter:drop-shadow(4px 6px 10px #0004);transform:scaleX(-1)}
#calle{position:absolute;bottom:14%;width:100%;height:18%;background:#555;z-index:2;box-shadow:inset 0 5px 15px #0005}
#linea{position:absolute;bottom:23%;width:100%;border-top:6px dashed #FFD700;z-index:3}

#pregunta{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:#fff;padding:30px;border-radius:20px;width:90%;max-width:700px;text-align:center;box-shadow:0 8px 30px #0004;z-index:10}
#pregunta h3{font-size:22px;color:#0d47a1;margin-bottom:20px}
.opcion{display:block;width:100%;padding:15px;margin:12px 0;border:2px solid #ddd;border-radius:12px;background:#f5f5f5;font-size:17px;cursor:pointer;text-align:left;font-weight:600;transition:0.2s}
.opcion:hover{background:#e3f2fd;border-color:#1976d2}
.opcion:disabled{cursor:not-allowed;opacity:0.7}

#feedback{font-size:40px;font-weight:bold;height:50px;margin:10px 0}
.bien{color:#2E8B57}
.mal{color:#d32f2f}

.info{position:absolute;top:15px;left:15px;background:#fff;padding:12px 20px;border-radius:10px;font-weight:bold;font-size:16px;z-index:10;box-shadow:0 3px 10px #0002}
.info button{margin-left:15px;padding:5px 10px;background:#d32f2f;color:#fff;border:none;border-radius:6px;cursor:pointer}
#prog{font-size:18px;font-weight:bold;color:#2E8B57}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h2>🎓 Camino a la Escuela</h2>
    <p style="margin-bottom:20px"><b>Instituto Rodolfo Reyes Toruño</b></p>
    <input id="nombre" placeholder="Nombre Completo" required>
    <select id="grado" required>
      <option value="">Selecciona Grado</option>
      <option>7mo</option><option>8vo</option><option>9no</option><option>10mo</option><option>11mo</option>
    </select>
    <input id="seccion" placeholder="Sección: A, B, C" required>
    <button class="btn" onclick="entrar()">▶ IR AL JUEGO</button>
  </div>
</div>

<div id="juego">
  <div class="info">
    <span id="n"></span> - <span id="g"></span>
    <button onclick="cerrarSesion()">Cambiar Alumno</button>
  </div>
  <div id="escuela">🏫</div>
  <div id="personaje">🚶‍♂️</div>
  <div id="linea"></div>
  <div id="calle"></div>
  <div id="pregunta">
    <h3 id="texto">Cargando...</h3>
    <div id="feedback"></div>
    <div id="ops"></div>
    <p id="prog">Pregunta 1 de 10</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// TU CONFIG DE FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCzu4rNjwLLQwt5BW9UxWvbMtD6JjR4Fa4",
  authDomain: "camino-a-la-escuela.firebaseapp.com",
  databaseURL: "https://camino-a-la-escuela-default-rtdb.firebaseio.com",
  projectId: "camino-a-la-escuela",
  storageBucket: "camino-a-la-escuela.firebasestorage.app",
  messagingSenderId: "113022794275",
  appId: "1:113022794275:web:c155955d9c61180f588f96"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let estudiante={}, numPregunta=0, fallos=0, pasos=0, usadas=[], bloqueado=false;

// BANCO DE 10 PREGUNTAS
let banco=[
{q:"¿Qué es la interfaz de un software de programación?",ops:["A. El código fuente","B. La parte visual con botones y menús","C. El compilador","D. Una variable"],r:1},
{q:"¿Cuál es una herramienta del software de programación?",ops:["A. Editor de código","B. Monitor","C. Teclado","D. Mouse"],r:0},
{q:"¿Para qué sirve un sistema de programación?",ops:["A. Para jugar","B. Para crear y ejecutar programas","C. Para navegar","D. Para dibujar"],r:1},
{q:"¿Qué representa un óvalo en un diagrama de flujo?",ops:["A. Proceso","B. Inicio/Fin","C. Decisión","D. Datos"],r:1},
{q:"¿Qué es un compilador?",ops:["A. Traduce código a lenguaje máquina","B. Una impresora","C. Un antivirus","D. Un navegador"],r:0},
{q:"¿Qué figura es una decisión en diagrama de flujo?",ops:["A. Rectángulo","B. Óvalo","C. Rombo","D. Flecha"],r:2},
{q:"¿Qué herramienta sirve para depurar errores?",ops:["A. Debugger","B. Paint","C. Word","D. Excel"],r:0},
{q:"¿Qué son los datos en un diagrama de flujo?",ops:["A. Las flechas","B. La información que entra y sale","C. Los procesos","D. El inicio"],r:1},
{q:"¿Cuál NO es parte de la interfaz de un IDE?",ops:["A. Barra de herramientas","B. Consola","C. CPU","D. Área de código"],r:2},
{q:"¿Qué hace un depurador?",ops:["A. Escribe código solo","B. Encuentra y corrige errores","C. Crea gráficos","D. Diseña páginas web"],r:1}
];

// AL CARGAR: revisa si ya hay alumno guardado
window.onload = function(){
  let guardado = localStorage.getItem('alumnoRRT');
  if(guardado){
    estudiante = JSON.parse(guardado);
    iniciarJuego();
  }
}

window.entrar = function(){
  let nom=document.getElementById('nombre').value.trim();
  let gra=document.getElementById('grado').value;
  let sec=document.getElementById('seccion').value.trim();
  if(nom==""||gra==""||sec==""){alert("Completa todos los campos");return;}
  estudiante={nombre:nom,grado:gra,seccion:sec};
  localStorage.setItem('alumnoRRT', JSON.stringify(estudiante)); // GUARDA
  iniciarJuego();
}

function iniciarJuego(){
  document.getElementById('n').innerText=estudiante.nombre;
  document.getElementById('g').innerText=estudiante.grado+" "+estudiante.seccion;
  document.getElementById('login').style.display='none';
  document.getElementById('juego').style.display='block';
  siguientePregunta();
}

window.cerrarSesion = function(){
  localStorage.removeItem('alumnoRRT'); // Para cambiar de alumno
  location.reload();
}

function siguientePregunta(){
  if(numPregunta>=10){
    if(fallos>0){
      let nota = 100 - (fallos * 10);
      if(nota<0) nota=0;
      guardarNota(nota);
      alert("Fallaste "+fallos+" pregunta(s). Tu nota: "+nota+". Reiniciando.");
      numPregunta=0;fallos=0;pasos=0;usadas=[];
      document.getElementById('personaje').style.left='3%';
    }else{
      guardarNota(100);
      document.getElementById('personaje').style.left='85%';
      document.getElementById('pregunta').innerHTML="<h2>¡FELICIDADES "+estudiante.nombre+"! 🎉</h2><p style='font-size:20px'>Entraste a la escuela. Nota: 100/100</p><button class='btn' onclick='location.reload()'>Jugar de Nuevo</button>";
      return;
    }
  }
  bloqueado=false;document.getElementById('feedback').innerHTML="";
  let i;do{i=Math.floor(Math.random()*banco.length)}while(usadas.includes(i));usadas.push(i);
  let preg=banco[i];
  document.getElementById('texto').innerText=preg.q;
  document.getElementById('prog').innerText="Pregunta "+(numPregunta+1)+" de 10";
  let cont=document.getElementById('ops');cont.innerHTML="";
  preg.ops.forEach((op,idx)=>{
    let b=document.createElement('button');b.className='opcion';b.innerText=op;
    b.onclick=function(){responder(idx==preg.r)};
    cont.appendChild(b);
  });
}

window.responder = function(esCorrecta){
  if(bloqueado)return; bloqueado=true;
  document.querySelectorAll('.opcion').forEach(b=>b.disabled=true);

  if(esCorrecta){
    document.getElementById('feedback').innerHTML="<span class='bien'>✓ CORRECTO</span>";
    pasos++;
    document.getElementById('personaje').style.left=(3+((82-11)/10)*pasos)+"%";
    numPregunta++;setTimeout(siguientePregunta,1500);
  }else{
    document.getElementById('feedback').innerHTML="<span class='mal'>✖ INCORRECTO</span>";
    fallos++;numPregunta++;setTimeout(siguientePregunta,1500);
  }
}

function guardarNota(nota){
  const notasRef = ref(db, 'notas_RRT/');
  const nuevaNotaRef = push(notasRef);
  set(nuevaNotaRef, {
    nombre: estudiante.nombre,
    grado: estudiante.grado,
    seccion: estudiante.seccion,
    nota: nota,
    aciertos: 10 - fallos,
    fallos: fallos,
    fecha: new Date().toLocaleString("es-NI")
  }).then(()=>{
    console.log("Nota guardada");
  }).catch((error)=>{
    alert("Error al guardar: "+error);
  });
}
</script>
</body>
</html>
